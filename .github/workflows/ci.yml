name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
        exclude:
          - { os: windows-latest, node: 22 }
          - { os: windows-latest, node: 24 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundles
        run: npm run build

      - name: Check dist/ bundles are up to date
        if: runner.os == 'Linux'
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/*.mjs bundles are out of sync with src/. Run 'npm run build' and commit the updated dist/ files."
            exit 1
          fi

      - name: Validate POSIX installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $scriptPath = (Resolve-Path -LiteralPath "install.ps1").Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            foreach ($err in $errors) {
              [Console]::Error.WriteLine($err.ToString())
            }
            exit 1
          }

      - name: Run test suite
        run: npm test

  stress:
    name: stress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run stress benchmark
        run: npm run bench:stress
